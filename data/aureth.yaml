# Shared data for the Aureth system tools.
# status: canon     = stated in the alteria_world files
#         decision  = chosen by the author in conversation, not yet in the world files
#         derived   = calculated from the above
#         unknown   = not settled; do not guess
# Distances for planets marked unknown must be filled in before the system tools can place them.

star:
  name: Aureth
  type: G-type            # decision (the world file may still say K-type)
  mass_msun: 1.0021       # pinned: implied by the original canon (374-day year at 0.87 AU); also fits Tarnic to 0.3%
  luminosity_lsun: 0.87   # proposal: "golden Aureth", a mature, mildly metal-rich G dwarf
  radius_rsun: 0.985
  teff_k: 5617            # cooler than the Sun (5772 K)
  model_note: >
    MIST v1.2 tracks at 1.0021 solar masses, calibrated so the model Sun matches the real Sun: [Fe/H] about +0.14
    at about 5 Gyr gives L 0.87, R 0.985, Teff about 5600 K. Solar metals at the same age are too bright;
    [Fe/H] +0.5 is too dim.
  status: proposal        # mass is pinned by canon; radius and luminosity are free to change

# Cycles measured from the simulation (Bayurindan years of 440 solar days). Re-measure on the "Long cycles" tab after
# changing any orbit. The planet cycles depend on Ashara's placeholder distance.
long_cycles:
  status: measured
  eclipse_year_days: 331
  double_full_moons: 2.8
  liwaya_eclipse_cycle: {years: 14.26, months: 163, note: "= 178 node-to-node months = 326 closest-to-closest months, to 0.03 day"}
  liwaya_node_turn: 19.4
  planet_grand_alignments_avg: 37.3
  moon_planes_line_up: 52.7
  planet_system_repeat: {years: 75.4, note: "13 Bayurinda-Ashara cycles = 31 Bayurinda-Tarnic = 18 Ashara-Tarnic"}
  great_cycle: {years: 527, note: "7 planet repeats = 10 moon-plane cycles = 37 eclipse cycles, agreeing to 0.15%"}
  axis_precession: {years: 12336, note: "moons do 78% of the pulling; assumes moment of inertia 0.33 (+-15%)"}
  orbit_eccentricity_cycle: {years: 23700, note: "eccentricity about 0.035 to 0.044, with Ashara at 0.3 Earth masses (was 172,000 years at 0.1)"}
  star_activity_cycle: {status: undecided, note: "not computed; the Sun's is 11 years"}

# Landmark timings (Bayurindan years of 440 solar days, measured; see the Landmarks tab).
landmarks:
  status: measured
  sun: {winter_solstice_day: 0, spring_equinox_day: 104, summer_solstice_day: 220, autumn_equinox_day: 335,
        note: "the direction the axis leans relative to perihelion is a free choice; the founding moment is set as a northern winter solstice at perihelion"}
  liwaya_declination_range_deg: [14.5, 17.5]       # obliquity 16 +- its 1.5 degree tilt
  liwaya_major_standstill_every_years: 19
  nineya_declination_range_deg: [9, 23]            # swings with the 52.7-year plane cycle
  calendar_repeat: "7 years = 80 Liwaya months exactly (38.5-day months, 440-day years): same phase, hour and date"
  eclipse_repeat_years: 14.26                      # same phase, node and distance, but 91 days off in the year
  axis_wobble_years: 12336                         # a fixed star's rising point creeps up to 0.8 degrees per century

# Interplanetary flight (lore from the author's worldbuilding discussions, not yet in the world files).
# A Weltreyker launches the vessel; once airborne and "nearing", a Sternreyker pilot's ethereal aspect wings change the
# vessel's velocity continuously. Acceleration depends on the pilot; there are no launch windows.
sternreykers:
  status: decision
  acceleration_g: {novice: 0.6, expert: 1.4}
  profile: accelerate to the halfway point, then brake (flip-and-burn); the pilot steers freely
  open_questions: ascent and descent time, how long the wings take to form, rest breaks and pilot fatigue

# Where the planets start at the founding moment (mean anomaly, degrees). Placeholder: all three on one ray from the
# star at perihelion, so at the founding double full moon the star, Bayurinda, Ashara and Tarnic are in a line.
system_start:
  status: placeholder
  phase_deg: {Bayurinda: 0, Ashara: 0, Tarnic: 0}
  inclination_deg: 0         # placeholder: all orbits flat in one plane

planets:
  - name: Calderic
    rank: 1
    type: barren world
    distance_au: null
    status: unknown
  - name: Nerveric
    rank: 2
    type: toxic world
    distance_au: null
    status: unknown
  - name: Bayurinda
    rank: 3
    type: ocean world
    distance_au: 0.97          # decision: moved out from the original 0.87 so Liwaya can fully cover the Sun
    eccentricity: 0.04
    diameter_km: 12000
    gravity_g: 0.9
    axial_tilt_deg: 16
    day_hours: 19              # solar day
    year_solar_days: 440       # decision: was 374 at 0.87 AU
    sunlight_earth: 0.93       # derived
    status: canon
    moons:                     # Design B: author's chosen design, hypothetical, not yet in the world files
      - name: Liwaya           # the larger moon (canon)
        status: decision
        diameter_km: 3450
        mean_distance_km: 362900
        sidereal_days: 28.03
        phase_cycle_solar_days: 38.5
        tilt_deg: 1.5
      - name: Nineya           # the smaller moon (canon)
        status: decision
        diameter_km: 1200
        mean_distance_km: 150250
        sidereal_days: 7.51
        phase_cycle_solar_days: 9.70
        tilt_deg: 1.5
    moon_pairing:
      status: decision
      repeat_solar_days: 1232  # 32 Liwaya cycles = 127 Nineya cycles = 2.80 years; deliberately not tied to the year
      plane_realignment_years: 52.7   # measured for the current tuning (minima at years 52.7, 105.4, 158.0, 210.7)
      solar_eclipses: Liwaya 83% total among central eclipses (Sun looks 0.541 deg, Liwaya 0.545); Nineya rings only
  - name: Ashara
    rank: 4
    type: cluster world
    distance_au: 1.1
    status: decision           # rank implies it lies between Bayurinda and Tarnic
    eccentricity: 0.03         # PLACEHOLDER: not settled
    mass_earth: 0.3            # decision: raised from 0.1; with a dense iron-rich core (5.5 g/cc) the compact equivalent has
                               # radius ~4,270 km, 0.67 g and a 7.5 km/s escape speed, enough to hold a tall breathable atmosphere
    density_gcc: 5.5           # decision: denser core (also the source of the magnetic field that shields the shared air)
    diameter_km: 8537          # derived: diameter of the compact equivalent; the fragments are spread wider than this
    gravity_g: 0.67            # derived, for the compact equivalent
    atmosphere: breathable, deep and tall (scale height ~14 km); fragments sit at different altitudes   # decision
    derived:
      year_days: 420.9
      sunlight_earth: 0.72     # derived
  - name: Tarnic
    rank: 5
    type: volcanic world
    distance_au: 1.38
    eccentricity: 0.045
    diameter_km: 14400
    gravity_g: 1.08
    axial_tilt_deg: 29
    day_hours: 25
    year_days_of_day_length: 567   # Kepler with the star above gives 567.9 at 1.38 AU (1.3787 AU gives exactly 567)
    sunlight_earth: 0.46           # derived
    status: canon
    moons: [Scornia]
  - name: Oric
    rank: 6
    type: gas giant
    distance_au: null
    status: unknown
  - name: Wenderic
    rank: 7
    type: eccentric, cryovolcanic, ice world
    distance_au: null
    status: unknown
  - name: Roderic
    rank: 8
    type: ringed gas giant
    distance_au: null
    status: unknown
