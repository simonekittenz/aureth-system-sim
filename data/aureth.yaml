    seed: 5
    count_along_galaxy: 380
    count_elsewhere: 200
  milky_way:
    pole: {lon: 215.0, lat: 28.0}   # the pole of the galaxy's plane; the band is the great circle 90 degrees from it
    centre_lon: 258.0               # ecliptic longitude toward the galaxy's bright centre (projected onto the plane)
    width_deg: 4.5                  # half-width of the bright band away from the centre
    bulge_width_deg: 6.5            # extra half-width at the centre
    bulge_length_deg: 30.0          # how far along the band the swelling reaches
    rift: {from_deg: 335.0, to_deg: 45.0, strength: 0.5}   # dark lane, in degrees along the band from the centre
    brightness: 1.0
    patches:                         # extra clouds: positive glows, negative is a dark cloud
      - {lon: 255.0, lat: -18.0, size_deg: 5.0, strength: 1.0}
      - {lon: 232.0, lat:   2.0, size_deg: 4.0, strength: 0.8}
