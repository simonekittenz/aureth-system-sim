      - {lon: 140.0, lat:  38.0, size_deg: 4.5, strength: 0.6}

planets:
  - name: Calderic
    rank: 1
    type: barren world
    distance_au: null
    status: unknown
  - name: Nerveric
    rank: 2
    type: toxic world
    distance_au: null
    status: unknown
  - name: Bayurinda
    rank: 3
    type: ocean world
    distance_au: 0.97          # decision: moved out from the original 0.87 so Liwaya can fully cover the Sun
    eccentricity: 0.04
    diameter_km: 12000
    gravity_g: 0.9
    axial_tilt_deg: 16
    day_hours: 19              # solar day
    year_solar_days: 440       # decision: was 374 at 0.87 AU
    sunlight_earth: 0.93       # derived
    status: canon
    moons:                     # Design B: author's chosen design, hypothetical, not yet in the world files
      - name: Liwaya           # the larger moon (canon)
        color: Silver-blue / pearlescent white     # canon: fresh water ice reflects light efficiently and fairly neutrally
        status: decision
        diameter_km: 3450
        mean_distance_km: 362900
        sidereal_days: 28.03
        phase_cycle_solar_days: 38.5
        tilt_deg: 1.5
      - name: Nineya           # the smaller moon (canon)
        color: Champagne gold / warm ivory         # canon: a subtle warm tint, not yellow stage lighting
        status: decision
        diameter_km: 1200
        mean_distance_km: 150250
        sidereal_days: 7.51
        phase_cycle_solar_days: 9.70
        tilt_deg: 1.5
    moon_pairing:
      status: decision
      repeat_solar_days: 1232  # 32 Liwaya cycles = 127 Nineya cycles = 2.80 years; deliberately not tied to the year
      plane_realignment_years: 52.8   # measured for the current tuning (minima at years 52.8, 105.7, 158.5, 211.3)
      solar_eclipses: Liwaya 83% total among central eclipses (Sun looks 0.541 deg, Liwaya 0.545); Nineya rings only
  - name: Ashara
    rank: 4
    type: cluster world
    distance_au: 1.1
    status: decision           # rank implies it lies between Bayurinda and Tarnic
    eccentricity: 0.03         # PLACEHOLDER: not settled
    axial_tilt_deg: 20         # PLACEHOLDER: not settled (the planet view needs a tilt to work out a sky)
    day_hours: 24              # PLACEHOLDER: not settled (solar day)
    placeholders: [eccentricity, axial_tilt_deg, day_hours]
    mass_earth: 0.3            # decision: raised from 0.1; with a dense iron-rich core (5.5 g/cc) the compact equivalent has
                               # radius ~4,270 km, 0.67 g and a 7.5 km/s escape speed, enough to hold a tall breathable atmosphere
    density_gcc: 5.5           # decision: denser core (also the source of the magnetic field that shields the shared air)
    diameter_km: 8537          # derived: diameter of the compact equivalent; the fragments are spread wider than this
    gravity_g: 0.67            # derived, for the compact equivalent
    atmosphere: breathable, deep and tall (scale height ~14 km); fragments sit at different altitudes   # decision
    derived:
      year_days: 420.9
      sunlight_earth: 0.72     # derived
  - name: Tarnic
    rank: 5
    type: volcanic world
    distance_au: 1.38
    eccentricity: 0.045
    diameter_km: 14400
    gravity_g: 1.08
    axial_tilt_deg: 29
    day_hours: 25
    year_days_of_day_length: 567   # Kepler with the star above gives 567.9 at 1.38 AU (1.3787 AU gives exactly 567)
    sunlight_earth: 0.46           # derived
    status: canon
    moons: [Scornia]
  - name: Oric
    rank: 6
    type: gas giant
    distance_au: null
    status: unknown
  - name: Wenderic
    rank: 7
    type: eccentric, cryovolcanic, ice world
    distance_au: null
    status: unknown
  - name: Roderic
    rank: 8
    type: ringed gas giant
    distance_au: null
    status: unknown
