# Shared data for the Aureth system tools.
# status: canon     = stated in the alteria_world files
#         decision  = chosen by the author in conversation, not yet in the world files
#         derived   = calculated from the above
#         unknown   = not settled; do not guess
# Distances for planets marked unknown must be filled in before the system tools can place them.

star:
  name: Aureth
  type: G-type            # decision (the world file may still say K-type)
  mass_msun: 1.0021       # pinned: implied by the original canon (374-day year at 0.87 AU); also fits Tarnic to 0.3%
  luminosity_lsun: 0.87   # proposal: "golden Aureth", a mature, mildly metal-rich G dwarf
  radius_rsun: 0.985
  teff_k: 5617            # cooler than the Sun (5772 K)
  model_note: >
    MIST v1.2 tracks at 1.0021 solar masses, calibrated so the model Sun matches the real Sun: [Fe/H] about +0.14
    at about 5 Gyr gives L 0.87, R 0.985, Teff about 5600 K. Solar metals at the same age are too bright;
    [Fe/H] +0.5 is too dim.
  status: proposal        # mass is pinned by canon; radius and luminosity are free to change

# Interplanetary flight (lore from the author's worldbuilding discussions, not yet in the world files).
# A Weltreyker launches the vessel; once airborne and "nearing", a Sternreyker pilot's ethereal aspect wings change the
# vessel's velocity continuously. Acceleration depends on the pilot; there are no launch windows.
sternreykers:
  status: decision
  acceleration_g: {novice: 0.6, expert: 1.4}
  profile: accelerate to the halfway point, then brake (flip-and-burn); the pilot steers freely
  open_questions: ascent and descent time, how long the wings take to form, rest breaks and pilot fatigue

# Where the planets start at the founding moment (mean anomaly, degrees). Placeholder: all three on one ray from the
# star at perihelion, so at the founding double full moon the star, Bayurinda, Ashara and Tarnic are in a line.
system_start:
  status: placeholder
  phase_deg: {Bayurinda: 0, Ashara: 0, Tarnic: 0}
  inclination_deg: 0         # placeholder: all orbits flat in one plane

planets:
  - name: Calderic
    rank: 1
    type: barren world
    distance_au: null
    status: unknown
  - name: Nerveric
    rank: 2
    type: toxic world
    distance_au: null
    status: unknown
  - name: Bayurinda
    rank: 3
    type: ocean world
    distance_au: 0.97          # decision: moved out from the original 0.87 so Liwaya can fully cover the Sun
    eccentricity: 0.04
    diameter_km: 12000
    gravity_g: 0.9
    axial_tilt_deg: 16
    day_hours: 19              # solar day
    year_solar_days: 440       # decision: was 374 at 0.87 AU
    sunlight_earth: 0.93       # derived
    status: canon
    moons:                     # Design B: author's chosen design, hypothetical, not yet in the world files
      - name: Liwaya           # the larger moon (canon)
        status: decision
        diameter_km: 3450
        mean_distance_km: 362900
        sidereal_days: 28.03
        phase_cycle_solar_days: 38.5
        tilt_deg: 1.5
      - name: Nineya           # the smaller moon (canon)
        status: decision
        diameter_km: 1200
        mean_distance_km: 150250
        sidereal_days: 7.51
        phase_cycle_solar_days: 9.70
        tilt_deg: 1.5
    moon_pairing:
      status: decision
      repeat_solar_days: 1232  # 32 Liwaya cycles = 127 Nineya cycles = 2.80 years; deliberately not tied to the year
      plane_realignment_years: 52.7   # measured for the current tuning (minima at years 52.7, 105.4, 158.0, 210.7)
      solar_eclipses: Liwaya 83% total among central eclipses (Sun looks 0.541 deg, Liwaya 0.545); Nineya rings only
  - name: Ashara
    rank: 4
    type: cluster world
    distance_au: 1.1
    status: decision           # rank implies it lies between Bayurinda and Tarnic
    eccentricity: 0.03         # PLACEHOLDER: not settled
    mass_earth: 0.1            # PLACEHOLDER: not settled (a fractured world; only matters for small perturbations)
    derived:
      year_days: 420.9
      sunlight_earth: 0.72     # derived
  - name: Tarnic
    rank: 5
    type: volcanic world
    distance_au: 1.38
    eccentricity: 0.045
    diameter_km: 14400
    gravity_g: 1.08
    axial_tilt_deg: 29
    day_hours: 25
    year_days_of_day_length: 567   # Kepler with the star above gives 567.9 at 1.38 AU (1.3787 AU gives exactly 567)
    sunlight_earth: 0.46           # derived
    status: canon
    moons: [Scornia]
  - name: Oric
    rank: 6
    type: gas giant
    distance_au: null
    status: unknown
  - name: Wenderic
    rank: 7
    type: eccentric, cryovolcanic, ice world
    distance_au: null
    status: unknown
  - name: Roderic
    rank: 8
    type: ringed gas giant
    distance_au: null
    status: unknown
